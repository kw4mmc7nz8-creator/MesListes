<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#009c9e"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MesListes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>MesListes</title><style>html,body{margin:0;min-height:100%;background:#009c9e}#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#009c9e;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}#boot strong{font-size:27px;font-weight:700}#boot .hourglass{font-size:40px;display:block;animation:bootTurn 1.8s ease-in-out infinite}#boot .bootLabel{font-size:15px;opacity:.9;text-align:center;max-width:320px;line-height:1.5}@keyframes bootTurn{0%,12%{transform:rotate(0)}48%,62%{transform:rotate(180deg)}98%,100%{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#boot .hourglass{animation:none}}#boot[hidden],#boot .hourglass[hidden]{display:none!important}#bootRetry{background:white;color:#007d80;border:0;border-radius:9px;padding:12px 24px;font-size:17px;font-weight:600}#bootDetail{font-size:12px;opacity:.85;max-width:320px;text-align:center}</style><link rel="stylesheet" href="style.css?v=17"></head><body><div id="boot" role="status" aria-live="polite"><strong>MesListes</strong><span class="hourglass" aria-hidden="true">⌛</span><span class="bootLabel">Chargement…</span></div><main id="app"></main><script>window.addEventListener('error',function(e){if(document.getElementById('boot')?.hidden)return;var l=document.querySelector('#boot .bootLabel');if(l)l.textContent='Une erreur empêche le démarrage. Vos listes sont conservées. Réessayez plus tard.';var s=document.querySelector('#boot .hourglass');if(s)s.hidden=true;var b=document.getElementById('bootRetry');if(!b){b=document.createElement('button');b.id='bootRetry';b.textContent='Réessayer';b.onclick=function(){location.reload()};document.getElementById('boot').appendChild(b)}});</script><script src="app.js?v=17" defer></script></body></html>
